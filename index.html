<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form UI</title>
</head>

<body>
    <div id="container">
        <div id="form-container">
            <main>
                <form>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="What should we call you?">
                    <h4 class="error"></h4>
                    <br><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                     <h4 class="error" ></h4>
                    <br><br>
                    <label for="password">Enter Password:</label>
                    <input type="password" id="email" name="email" required placeholder="xxxxxx">
                     <h4 class="error"></h4>
                    <br><br>
                    <label for="password">Confirm Password:</label>
                    <input type="password" id="email" name="email" required placeholder="xxxxxx">
                     <h4 class="error"></h4>
                    <br><br>
                </form>
                <input type="submit" value="Update Profile">
            </main>
            <div id="task-container">
                <div id="circle">
                    <h1>65%</h1>
                </div>
                <h1>Profile Completeness</h1>
                <div id="taskList">
                    <ul>
                        <li>Create Account</li>
                        <li>Update Roadmap Progress</li>
                        <li>Setup Public Profile</li>
                        <li>Complete Your First Project</li>
                        <li>Invite Your Friends</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
